version: '3.8'

services:
  app:
    build: .
    container_name: api8inf349-app
    environment:
      - REDIS_URL=redis://host.docker.internal:6379/0
      - DB_HOST=host.docker.internal
      - DB_USER=user
      - DB_PASSWORD=pass
      - DB_PORT=5432
      - DB_NAME=api8inf349
    ports:
      - "5000:5000"
    depends_on:
      - db
      - redis

  db:
    image: postgres:12
    container_name: postgres-db
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=pass
      - POSTGRES_DB=api8inf349
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:5-alpine
    container_name: redis-db
    ports:
      - "6379:6379"

volumes:
  postgres_data:
