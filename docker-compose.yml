version: "3.8"

services:
  db:
    image: postgres:12
    container_name: postgres-db
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=pass
      - POSTGRES_DB=api8inf349
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:6-alpine
    container_name: redis-db
    ports:
      - "6379:6379"

  app:
    build: .
    container_name: api8inf349-app
    environment:
      - FLASK_APP=app
      - FLASK_ENV=development
      - REDIS_URL=redis://redis:6379/0
      - DB_NAME=api8inf349
      - DB_USER=user
      - DB_PASSWORD=pass
      - DB_HOST=db
      - DB_PORT=5432
    ports:
      - "5000:5000"
    depends_on:
      - db
      - redis
    volumes:
      - .:/app

volumes:
  postgres_data:
